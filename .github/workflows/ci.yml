name: CI - ACME Project Tracker

# Backend: lint, security scan and tests against a real PostgreSQL. Frontend: lint, types, tests with a coverage gate,
# production build and dependency audit. (Written to mirror ./bin/test-backend.sh and `npm run test:coverage`.)
on: [pull_request, push]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres123
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASS: postgres123
    defaults:
      run:
        working-directory: backend/pm-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pm-api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt bandit
      - name: Lint
        run: ruff check app tests
      - name: Security scan (same as the template workflow)
        working-directory: .
        run: bandit -q -r ./backend
      - name: Tests (coverage gate 80%)
        run: python -m pytest tests -p no:warnings --cov --cov-report=term-missing:skip-covered --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests (coverage gate 80%)
        run: npm run test:coverage
      - run: npm run build
      - run: npm audit --audit-level=high
